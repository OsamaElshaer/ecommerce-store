version: '3.9'

services:
    app:
        build:
            target: development
        env_file:
            - .env.dev
        environment:
            NODE_ENV: development
        ports:
            - '3000:3000'
            - '9229:9229'
        volumes:
            - .:/app
            - /app/node_modules
        command: npm run start:dev

    postgres:
        env_file:
            - .env.dev

        ports:
            - '5432:5432'
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data

volumes:
    postgres_dev_data:
