version: "3.9"

services:
    app:
        build:
            context: .
        container_name: ecommerce_app
        depends_on:
            - postgres
        networks:
            - ecommerce_network

    postgres:
        image: postgres:16-alpine
        container_name: ecommerce_postgres
        restart: always
        networks:
            - ecommerce_network

networks:
    ecommerce_network:
        driver: bridge
