version: "3.9"

services:
    app:
        build:
            target: production
        env_file:
            - .env.prod
        environment:
            NODE_ENV: production
        ports:
            - "3000:3000"
        restart: always
        command: npm run start:prod

    postgres:
        env_file:
            - .env.prod
        restart: always
        volumes:
            - postgres_prod_data:/var/lib/postgresql/data

volumes:
    postgres_prod_data:
